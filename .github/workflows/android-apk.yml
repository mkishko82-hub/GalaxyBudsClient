name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build APK
        run: |
          dotnet publish GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj \
            -f net10.0-android36.1 \
            -c Debug \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=false \
            -p:EmbedAssembliesIntoApk=true \
            -p:IsAndroid=true \
            -p:RuntimeIdentifier=android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudsClient-Android
          path: 'GalaxyBudsClient.Android/bin/Debug/net10.0-android36.1/android-arm64/publish/*.apk'
          if-no-files-found: error
